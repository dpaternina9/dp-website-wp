name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # release.yml calls this workflow so that "the gates" and "the gates a release
  # runs" cannot drift apart. The `commits` job below is already scoped to
  # pull_request and stays skipped when it is called.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Static gates. No WordPress, no Docker — fastest feedback first.
  # composer lint + composer analyse (CLAUDE.md §1.6)
  # ---------------------------------------------------------------------------
  static:
    name: PHP static analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4' ]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: '--prefer-dist'

      - name: composer lint
        run: composer lint

      - name: composer analyse
        run: composer analyse

  # ---------------------------------------------------------------------------
  # JS gates. npm run lint + npm run test:unit (CLAUDE.md §1.6)
  # ---------------------------------------------------------------------------
  javascript:
    name: JavaScript lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install npm dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: npm run lint
        run: npm run lint

      - name: npm run test:unit
        run: npm run test:unit

  # ---------------------------------------------------------------------------
  # Everything that needs a running WordPress.
  # composer test (Unit + Integration) + npm run test:e2e (CLAUDE.md §1.6)
  # ---------------------------------------------------------------------------
  wordpress:
    name: PHPUnit and Playwright against wp-env (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4' ]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: '--prefer-dist'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install npm dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # dp-core's editor bundle is compiled, not committed. The integration
      # suite registers dp/callout from plugins/dp-core/build/callout, and the
      # e2e suite opens the editor, so both need the build to exist first.
      - name: npm run build
        run: npm run build

      - name: Start wp-env
        run: npm run env:start

      - name: composer test
        run: composer test

      - name: npm run test:e2e
        run: npm run test:e2e

      - name: Collect wp-env logs on failure
        if: failure()
        run: npx wp-env logs all --watch=false || true

      - name: Upload Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-php-${{ matrix.php }}
          path: artifacts/
          retention-days: 7

      - name: Stop wp-env
        if: always()
        run: npm run env:stop || true

  # ---------------------------------------------------------------------------
  # Commit hygiene. The husky hook covers local commits; this covers the PR.
  # ---------------------------------------------------------------------------
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install npm dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint commit messages
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
