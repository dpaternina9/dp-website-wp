name: Release

# Tagging is the whole deploy (CLAUDE.md §4). A push of `theme-v1.2.3` or
# `plugin-v1.2.3` runs every gate and then hands off to the reusable release
# workflow in fanxie-lab/wordpress-updater, which stages, stamps, zips, signs
# an Ed25519 manifest, verifies it against the key the build ships, uploads
# the ZIP to wp-updates.fanxie.cloud, confirms the public package URL
# resolves, and only then publishes the manifest that points at it. See
# docs/adr/0015-adopt-the-wp-update-client-library.md.
#
# `workflow_dispatch` does everything except publish (`publish: false`). It is
# the way to find out that the signing key is wrong, or that Composer will not
# run inside the plugin, without minting a tag to discover it.
#
# ## Secrets this workflow needs
#
#   DPATERNINA_UPDATE_SIGNING_KEY   base64 Ed25519 secret key from the
#                                   library's `release.php keygen`. Its public
#                                   half must already be committed in
#                                   DP\Core\Update\UpdateKey::COMPILED.
#   DPATERNINA_UPDATE_UPLOAD_TOKEN  bearer token for the `dpaternina`
#                                   namespace on the wp-updates.fanxie.cloud
#                                   write Worker.

on:
  push:
    tags:
      - 'theme-v*'
      - 'plugin-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to build (dry run — nothing publishes)'
        required: true
        type: choice
        options: [ theme, plugin ]
      version:
        description: 'Version to stamp (semver, no leading v)'
        required: true
        type: string
        default: '0.0.0'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Every gate in CLAUDE.md §1.6, by calling the CI workflow rather than
  # restating it. The reusable release workflow runs no gates of its own — the
  # caller's gates are the gates, and a release that skipped one is a release
  # nobody trusts.
  # ---------------------------------------------------------------------------
  gates:
    name: Quality gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # Work out what we are releasing. A tag is authoritative; a manual run says
  # so explicitly and never publishes.
  #
  # `asset_build` is the reusable workflow's one hook for compiling anything
  # before the source directory is staged, and it does two jobs here.
  #
  # **It compiles the plugin's editor bundle.** `plugins/dp-core/build/` is
  # generated and git-ignored, so it does not exist in this job's checkout —
  # `npm run build` is what puts it there, and it has to run here because the
  # gates job that also runs it is a different runner with a different
  # workspace. Without it the ZIP ships with no `build/` at all, and the
  # symptom on the installed site is not a missing feature but a broken
  # editor: `DP\Core\Blocks\Callout` registers `dp/callout` from that
  # directory, and that block's `editorScript` is the only thing that enqueues
  # the bundle every other `dp/*` block's editor half lives in. One absent
  # directory therefore takes out the five server-rendered blocks, the seven
  # field blocks and the Page fields panel, each reported as "your site
  # doesn't include support for this block". It shipped that way in 1.0.0.
  # The theme compiles nothing — its editor script is a hand-written file —
  # so it skips the npm install rather than paying for it.
  #
  # **It stamps the PHP VERSION constant** beside the header. The library's
  # build script stamps the header, composer.json and readme.txt, but knows
  # nothing about our constants.
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve the release
    runs-on: ubuntu-latest
    outputs:
      type: ${{ steps.r.outputs.type }}
      slug: ${{ steps.r.outputs.slug }}
      version: ${{ steps.r.outputs.version }}
      source_dir: ${{ steps.r.outputs.source_dir }}
      main_file: ${{ steps.r.outputs.main_file }}
      asset_build: ${{ steps.r.outputs.asset_build }}
      publish: ${{ steps.r.outputs.publish }}
    steps:
      - id: r
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$EVENT" == "push" ]]; then
            case "$REF_NAME" in
              theme-v*)  pkg=theme;  version="${REF_NAME#theme-v}"  ;;
              plugin-v*) pkg=plugin; version="${REF_NAME#plugin-v}" ;;
              *) echo "::error::${REF_NAME} is not a release tag."; exit 1 ;;
            esac
            publish=true
          else
            pkg="$INPUT_PACKAGE"
            version="${INPUT_VERSION#v}"
            publish=false
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${version}' is not semver."
            exit 1
          fi

          if [[ "$pkg" == "theme" ]]; then
            constant_file=themes/dpaternina/functions.php
            compile=""
            {
              echo "type=theme"
              echo "slug=dpaternina"
              echo "source_dir=themes/dpaternina"
              echo "main_file=style.css"
            } >> "$GITHUB_OUTPUT"
          else
            constant_file=plugins/dp-core/dp-core.php
            compile="npm ci --no-audit --no-fund && npm run build && "
            {
              echo "type=plugin"
              echo "slug=dp-core"
              echo "source_dir=plugins/dp-core"
              echo "main_file=dp-core.php"
            } >> "$GITHUB_OUTPUT"
          fi

          {
            echo "version=${version}"
            echo "publish=${publish}"
            echo "asset_build=${compile}sed -i \"s/^const VERSION = '.*';\$/const VERSION = '${version}';/\" ${constant_file}"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${pkg} ${version} (publish=${publish})"

  # ---------------------------------------------------------------------------
  # Build, sign, verify — and publish only on a tag. The reusable workflow
  # refuses to build while UpdateKey::COMPILED is empty, uploads the ZIP
  # before the manifest, and confirms the public package URL resolves in
  # between, so a manifest can never point at a download that does not exist.
  # ---------------------------------------------------------------------------
  publish:
    name: Build, sign and publish
    needs: [ gates, resolve ]
    uses: fanxie-lab/wordpress-updater/.github/workflows/release.yml@main
    with:
      type: ${{ needs.resolve.outputs.type }}
      slug: ${{ needs.resolve.outputs.slug }}
      namespace: dpaternina
      version: ${{ needs.resolve.outputs.version }}
      source_dir: ${{ needs.resolve.outputs.source_dir }}
      main_file: ${{ needs.resolve.outputs.main_file }}
      key_file: plugins/dp-core/src/Update/UpdateKey.php
      asset_build: ${{ needs.resolve.outputs.asset_build }}
      publish: ${{ needs.resolve.outputs.publish == 'true' }}
    secrets:
      signing_key: ${{ secrets.DPATERNINA_UPDATE_SIGNING_KEY }}
      upload_token: ${{ secrets.DPATERNINA_UPDATE_UPLOAD_TOKEN }}
