<x-dc>
<section style="{{ wrapStyle }}">
  <h1 style="margin: 0 0 16px; font-family: var(--font-display); font-weight: 700; font-size: clamp(2.25rem, 5.5vw, 3.75rem); line-height: var(--lh-tight); letter-spacing: var(--ls-display); text-wrap: balance; max-width: {{ titleMax }}">{{ title }}</h1>
  <sc-if value="{{ hasDeck }}">
    <p style="margin: 0; max-width: var(--measure); font-size: var(--fs-md); line-height: var(--lh-relaxed); color: var(--text-secondary); text-wrap: pretty">{{ deck }}</p>
  </sc-if>
  <sc-if value="{{ hasMeta }}">
    <div style="margin-top: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border-subtle); font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: var(--ls-caps); color: var(--text-muted)">{{ meta }}</div>
  </sc-if>
</section>
</x-dc>
<!-- props: title, deck, meta, width ('lg'|'md'|'reading'), titleMax (default '20ch' at call sites), tight (bool)
     wrapStyle = { maxWidth: lg -> var(--container-lg), md|reading -> var(--container-md);
                   margin: 0 auto;
                   padding: clamp(48px, 8vw, 80px) var(--gutter) (tight ? 24px : 40px) } -->
