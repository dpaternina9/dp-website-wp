<!-- NOTE: inline `src="data:image/png;base64,…"` for the dP mark has been replaced with
     assets/dp-mark-gradient-128.png during import. Everything else is verbatim. -->
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/tokens/fonts.css">
<link rel="stylesheet" href="_ds/tokens/colors.css">
<link rel="stylesheet" href="_ds/tokens/typography.css">
<link rel="stylesheet" href="_ds/tokens/spacing.css">
<link rel="stylesheet" href="_ds/tokens/effects.css">
<link rel="stylesheet" href="_ds/tokens/base.css">
</helmet>

<footer class="dp-dark" style="border-top: 1px solid var(--border-subtle); background: var(--band)">
  <div style="max-width: var(--container-lg); margin: 0 auto; padding: 56px var(--gutter) 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 40px 32px">

    <div style="display: flex; flex-direction: column; gap: 16px">
      <div onClick="{{ onHome }}" role="link" tabindex="0" style="cursor: pointer; display: flex; align-items: center">
        <img src="assets/dp-mark-gradient-128.png" alt="dP — David Paternina" width="30" height="30" style="display: block; opacity: 0.85">
      </div>
      <p style="margin: 0; max-width: 26ch; font-size: var(--fs-sm); line-height: var(--lh-relaxed); color: var(--text-secondary); text-wrap: pretty">One site for the work and the writing, because they were never two people.</p>
      <sc-if value="{{ live }}">
        <div onClick="{{ onWatch }}" role="link" tabindex="0" style="cursor: pointer; display: inline-flex; align-self: flex-start; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: var(--ls-caps); color: var(--hue-pink)">
          <span style="width: 7px; height: 7px; border-radius: var(--radius-circle); background: var(--dp-pink)"></span>
          LIVE RIGHT NOW
        </div>
      </sc-if>
    </div>

    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
      <nav style="display: flex; flex-direction: column; gap: 12px">
        <div style="font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: var(--ls-caps); color: var(--text-muted)">{{ g.label }}</div>
        <sc-for list="{{ g.links }}" as="l" hint-placeholder-count="4">
          <span onClick="{{ l.onClick }}" role="link" tabindex="0" style="cursor: pointer; font-size: var(--fs-sm); color: var(--text-secondary); transition: color var(--dur-base) var(--ease-standard)" style-hover="color: var(--text-primary)">{{ l.label }}</span>
        </sc-for>
      </nav>
    </sc-for>

  </div>
  <div style="max-width: var(--container-lg); margin: 0 auto; padding: 20px var(--gutter) 40px; border-top: 1px solid var(--border-subtle); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
    <span style="font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: var(--ls-caps); color: var(--text-muted)">© {{ year }} DAVID PATERNINA</span>
    <div style="display: flex; flex-wrap: wrap; gap: 20px">
      <span onClick="{{ onPrivacy }}" role="link" tabindex="0" style="cursor: pointer; font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: var(--ls-caps); color: var(--text-muted)" style-hover="color: var(--text-secondary)">PRIVACY</span>
      <span onClick="{{ onColophon }}" role="link" tabindex="0" style="cursor: pointer; font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: var(--ls-caps); color: var(--text-muted)" style-hover="color: var(--text-secondary)">COLOPHON</span>
      <a href="/rss.xml" style="font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: var(--ls-caps); color: var(--text-muted)">RSS</a>
    </div>
  </div>
</footer>
</x-dc>
